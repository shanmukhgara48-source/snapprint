name: snapprint_admin
description: "SnapPrint Admin Dashboard - Flutter Web"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^3.3.2
  go_router: ^14.6.3

  # HTTP
  dio: ^5.8.0+1

  # UI
  data_table_2: ^2.5.13
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1

  # File picking (web-compatible image upload)
  file_picker: ^8.1.7

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
