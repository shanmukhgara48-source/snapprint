name: Flutter CI

on:
  push:
    branches: [main]
    paths: ["snap_print/**", "admin/**"]
  pull_request:
    paths: ["snap_print/**", "admin/**"]

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [snap_print, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze
