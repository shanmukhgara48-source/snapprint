name: snap_print
description: "SnapPrint - Photo Product E-Commerce Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^17.3.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5

  # HTTP
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Realtime (WebSocket sync with backend)
  web_socket_channel: ^3.0.1

  # Image & File Picking
  image_picker: ^1.1.2
  file_picker: ^8.1.7

  # Payment
  razorpay_flutter: ^1.3.7

  # Maps
  google_maps_flutter: ^2.10.0

  # UI
  cached_network_image: ^3.4.1
  flutter_carousel_widget: ^3.0.0
  google_fonts: ^6.2.1
  pinput: ^5.0.0
  shimmer: ^3.0.0
  badges: ^3.1.2
  flutter_svg: ^2.0.17

  # Utils
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4

  # Google Sign-In (Google Photos access)
  google_sign_in: ^6.2.2

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cloud_firestore: ^5.6.12


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1
  freezed: ^2.5.8
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   Add custom fonts here when available.
  #   Arial is a licensed font — obtain Arial.ttf / Arial_Bold.ttf and place
  #   them in assets/fonts/, then uncomment the block below.
  #   - family: Arial
  #     fonts:
  #       - asset: assets/fonts/Arial.ttf
  #       - asset: assets/fonts/Arial_Bold.ttf
  #         weight: 700
